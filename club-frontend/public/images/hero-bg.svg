<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="40%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#6366f1" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/><line x1="800" y1="0" x2="800" y2="600"/>
    <line x1="1000" y1="0" x2="1000" y2="600"/>
  </g>
  <!-- Decorative circles -->
  <circle cx="950" cy="200" r="120" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.15"/>
  <circle cx="950" cy="200" r="80" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.1"/>
  <circle cx="950" cy="200" r="40" fill="#6366f1" opacity="0.08"/>
  <!-- Floating shapes -->
  <rect x="1050" y="350" width="60" height="60" rx="8" fill="#6366f1" opacity="0.08" transform="rotate(15 1080 380)"/>
  <rect x="1100" y="100" width="40" height="40" rx="6" fill="#8b5cf6" opacity="0.06" transform="rotate(-10 1120 120)"/>
  <circle cx="150" cy="450" r="30" fill="#6366f1" opacity="0.06"/>
</svg>
