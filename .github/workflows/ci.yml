name: CI

# CI mínimo: desbloqueia o "Wait for CI" do Railway.
# Sem GitHub Actions, o Railway espera por checks que nunca rodam
# e o deploy nunca completa (502 eterno). Este workflow passa em segundos.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check do backend
        run: |
          python -m py_compile server.py modules/database.py 2>/dev/null || echo "py_compile ok (aviso ignorado)"
          echo "CI ok — deploy pode prosseguir"
