<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{APP_NAME}} — DEZAFIRA</title>
    <meta name="description" content="{{DESCRIPTION}}">

    <link rel="manifest" href="{{MANIFEST_URL}}">
    <meta name="theme-color" content="{{THEME}}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
    <link rel="apple-touch-icon" href="{{ICON_512}}">

    <meta property="og:title" content="{{APP_NAME}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --accent: #60A5FA;
            --bg: #090D16;
            --surface: #131A2C;
            --text: #F3F4F6;
            --text-muted: #9CA3AF;
            --border: #1E293B;
            --primary-glow: rgba(59,130,246,0.15);
            --gradient: 135deg, #1E3A5F, #3B82F6;
            --emoji: "⚡";
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        * { box-sizing:border-box; margin:0; padding:0; font-family:'Plus Jakarta Sans','Outfit',sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            padding-left: var(--safe-left);
            padding-right: var(--safe-right);
        }

        .decor-circle {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.4;
            pointer-events: none;
        }
        .circle-1 { width: 300px; height: 300px; background: var(--primary); top: -50px; left: -100px; }
        .circle-2 { width: 400px; height: 400px; background: var(--primary-dark); bottom: -50px; right: -100px; }

        header {
            width: 100%;
            max-width: 600px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            z-index: 10;
            background: var(--bg);
            position: sticky;
            top: 0;
            padding-top: calc(16px + var(--safe-top));
        }
        .logo { font-weight: 800; font-size: 1.3rem; color: var(--text); display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--primary); }
        .logo .niche-emoji { font-size: 1.4rem; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn-install {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 4px;
        }
        .btn-install.visible { display: flex; }
        .btn-install:active { transform: scale(0.96); }

        main {
            flex: 1;
            width: 100%;
            max-width: 600px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        .view { display: none; animation: fadeSlideIn 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards; }
        .view.active { display: block; }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero { text-align: center; margin-bottom: 40px; }
        .hero h1 {
            font-size: 2.2rem; font-weight: 800; line-height: 1.2;
            margin-bottom: 15px;
            background: linear-gradient(var(--gradient));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero p { color: var(--text-muted); font-size: 1.1rem; line-height: 1.5; margin-bottom: 30px; }
        .hero .niche-tagline { color: var(--accent); font-size: 0.9rem; font-weight: 600; margin-bottom: 20px; }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; border: none; padding: 16px 32px; font-size: 1.1rem;
            font-weight: 700; border-radius: 14px; cursor: pointer; width: 100%;
            box-shadow: 0 4px 14px var(--primary-glow);
            transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.15s ease;
        }
        .btn:active { transform: scale(0.97); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--primary-glow); }

        .btn-outline {
            background: transparent; border: 1.5px solid var(--primary);
            color: var(--primary); box-shadow: none;
        }
        .btn-outline:hover { background: var(--primary-glow); }

        /* Progress bar */
        .progress-container {
            width: 100%; height: 6px; background-color: var(--surface);
            border-radius: 3px; margin-bottom: 30px; overflow: hidden;
        }
        .progress-bar {
            height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 3px; transition: width 0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        .progress-label {
            text-align: center; font-size: 0.8rem; color: var(--text-muted);
            margin-bottom: 8px;
        }

        .question-card h2 {
            font-size: 1.35rem; font-weight: 700; margin-bottom: 24px; line-height: 1.3;
        }

        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-item {
            background-color: var(--surface); border: 1px solid var(--border);
            padding: 18px 20px; border-radius: 14px; cursor: pointer;
            font-weight: 600; font-size: 1rem;
            display: flex; align-items: center; justify-content: space-between;
            transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), border-color 0.15s, background 0.15s;
        }
        .option-item:active { transform: scale(0.98); }
        .option-item:hover, .option-item.selected {
            border-color: var(--primary); background: var(--primary-glow);
        }
        .option-item .check-mark { color: var(--primary); font-weight: 800; opacity: 0; }
        .option-item.selected .check-mark { opacity: 1; }

        /* Skeleton shimmer */
        .skeleton {
            background: linear-gradient(90deg, var(--surface) 25%, rgba(255,255,255,0.05) 50%, var(--surface) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 10px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .skeleton-text { height: 16px; margin-bottom: 12px; }
        .skeleton-text.short { width: 60%; }
        .skeleton-text.medium { width: 80%; }
        .skeleton-card { height: 200px; margin-bottom: 20px; }

        /* Bottom sheet */
        .sheet-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 100;
            display: none; align-items: flex-end; justify-content: center;
        }
        .sheet-overlay.open { display: flex; }
        .sheet-overlay.open .sheet-panel { transform: translateY(0); }
        .sheet-panel {
            background: var(--surface); border-radius: 24px 24px 0 0;
            width: 100%; max-width: 600px; max-height: 85vh;
            overflow-y: auto; padding: 28px 24px;
            padding-bottom: calc(28px + var(--safe-bottom));
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
            border: 1px solid var(--border);
        }
        .sheet-handle {
            width: 36px; height: 5px; background: var(--border);
            border-radius: 3px; margin: 0 auto 20px;
        }
        .sheet-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 16px; }
        .sheet-emoji { font-size: 3rem; text-align: center; margin-bottom: 12px; }
        .sheet-desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; }

        /* Result cards */
        .result-card {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 14px; padding: 20px; margin-bottom: 12px;
        }
        .result-card h3 { font-size: 1.1rem; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
        .result-card p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.4; }

        /* Drip timeline */
        .timeline { display: flex; flex-direction: column; gap: 16px; }
        .timeline-item {
            display: flex; gap: 14px; align-items: flex-start;
        }
        .timeline-dot {
            width: 44px; height: 44px; min-width: 44px;
            border-radius: 50%; background: var(--surface); border: 2px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 0.85rem; color: var(--text-muted);
        }
        .timeline-dot.unlocked {
            background: var(--primary); border-color: var(--primary);
            color: white; box-shadow: 0 0 12px var(--primary-glow);
        }
        .timeline-dot.today {
            border-color: var(--accent); color: var(--accent);
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot { 0%,100% { box-shadow: 0 0 0 0 rgba(96,165,250,0.4); } 50% { box-shadow: 0 0 0 10px rgba(96,165,250,0); } }
        .timeline-content { flex: 1; }
        .timeline-content h4 { font-size: 0.95rem; font-weight: 700; margin-bottom: 2px; }
        .timeline-content p { font-size: 0.8rem; color: var(--text-muted); }
        .timeline-locked { opacity: 0.45; }

        /* Streak */
        .streak-bar {
            display: flex; align-items: center; gap: 10px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px 16px; margin-bottom: 20px;
        }
        .streak-fire { font-size: 1.5rem; }
        .streak-count { font-size: 1.2rem; font-weight: 800; color: var(--accent); }
        .streak-label { font-size: 0.8rem; color: var(--text-muted); }

        .loading-container { text-align: center; padding: 40px 0; }
        .spinner {
            border: 4px solid var(--surface); border-top: 4px solid var(--primary);
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .pricing-section { text-align: center; border-top: 1px dashed var(--border); padding-top: 25px; }
        .price-tag { font-size: 2.2rem; font-weight: 800; color: var(--text); margin-bottom: 20px; }
        .price-tag span { font-size: 1rem; color: var(--text-muted); font-weight: 400; }

        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(16,185,129,0.15); color: #10B981;
            padding: 4px 10px; border-radius: 20px; font-size: 0.75rem;
            font-weight: 700;
        }

        .share-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .share-btn {
            flex: 1; min-width: 100px; padding: 10px 14px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--bg);
            color: var(--text); font-size: 0.85rem; font-weight: 600;
            cursor: pointer; text-align: center;
        }
        .share-btn:active { transform: scale(0.97); }

        .cta-section { text-align: center; margin-top: 24px; }
        .cta-section .btn { margin-bottom: 10px; }

        @media (max-width: 480px) {
            .hero h1 { font-size: 1.7rem; }
            .hero p { font-size: 0.95rem; }
            .question-card h2 { font-size: 1.15rem; }
            .sheet-panel { padding: 20px 18px; }
        }
    </style>
</head>
<body>
    <div class="decor-circle circle-1"></div>
    <div class="decor-circle circle-2"></div>

    <header>
        <div class="logo">
            <span class="niche-emoji" id="nicheEmoji">⚡</span>
            <span id="logoAppName">{{APP_NAME}}</span>
        </div>
        <div class="header-actions">
            <button class="btn-install" id="btnInstall" title="Instalar App">
                📲 Instalar
            </button>
        </div>
    </header>

    <main>
        <!-- Landing -->
        <section id="view-landing" class="view active">
            <div class="hero">
                <h1 id="lpTitle">{{HEADLINE}}</h1>
                <div class="niche-tagline" id="lpTagline">{{TAGLINE}}</div>
                <p id="lpSubtitle">{{SUBHEADLINE}}</p>
                <button class="btn" id="startBtn">{{CTA_TEXT}}</button>
            </div>
            <div id="landing-extra"></div>
        </section>

        <!-- Quiz -->
        <section id="view-quiz" class="view">
            <div class="progress-label" id="progressLabel">Pergunta 1 de 5</div>
            <div class="progress-container">
                <div class="progress-bar" id="quizProgress"></div>
            </div>
            <div class="question-card" id="questionCard"></div>
        </section>

        <!-- Skeleton loading -->
        <section id="view-loading" class="view">
            <div class="loading-container">
                <div class="skeleton skeleton-card" style="margin-bottom:24px;"></div>
                <div class="skeleton skeleton-text medium"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text short"></div>
                <p style="color:var(--text-muted);margin-top:20px;font-size:0.9rem;" id="loadingText">Analisando suas respostas...</p>
            </div>
        </section>

        <!-- Drip Timeline -->
        <section id="view-drip" class="view">
            <div class="streak-bar" id="streakBar">
                <span class="streak-fire">🔥</span>
                <span class="streak-count" id="streakCount">1</span>
                <span>dias seguidos</span>
            </div>
            <h2 style="font-size:1.3rem;font-weight:800;margin-bottom:16px;">Seu Cronograma</h2>
            <div class="timeline" id="timelineList"></div>
        </section>

        <!-- Premium Results -->
        <section id="view-premium" class="view">
            <div class="result-card" style="text-align:center;padding:30px;">
                <div style="font-size:3rem;margin-bottom:12px;">🎉</div>
                <h2 style="margin-bottom:8px;">Relatório Completo</h2>
                <p style="color:var(--text-muted);margin-bottom:20px;" id="premiumDesc">Com base nas suas respostas, preparamos recomendações personalizadas.</p>
                <div id="premiumResults" style="text-align:left;"></div>
                <div class="cta-section">
                    <div class="share-buttons" id="shareButtons">
                        <button class="share-btn" id="shareWhatsApp">WhatsApp</button>
                        <button class="share-btn" id="shareCopy">Copiar Link</button>
                    </div>
                    <button class="btn" id="restartBtn" style="margin-top:16px;">Refazer Quiz</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Bottom Sheet overlay -->
    <div class="sheet-overlay" id="sheetOverlay">
        <div class="sheet-panel" id="sheetPanel">
            <div class="sheet-handle"></div>
            <div id="sheetContent"></div>
        </div>
    </div>

    <script>
        (function() {
            // ——— Config from placeholders ———
            var APP_ID = "{{APP_ID}}" || "demo";
            var SLUG = "{{SLUG}}" || "app";
            var APP_NAME = "{{APP_NAME}}" || "Dezafira App";
            var NICHE = "{{NICHE}}" || "Geral";
            var CTA_TEXT = "{{CTA_TEXT}}" || "Obter Relatório";
            var CHECKOUT_URL = "{{CHECKOUT_URL}}" || "";
            var MANIFEST_URL = "{{MANIFEST_URL}}" || "";
            var SW_URL = "{{SW_URL}}" || "";

            var THEME = {};
            try { THEME = JSON.parse('{{THEME}}' || '{}'); } catch(e) {}

            var QUESTIONS = [];
            try { QUESTIONS = JSON.parse('{{QUESTIONS_JSON}}' || '[]'); } catch(e) { QUESTIONS = []; }

            var DRIP_ITEMS = [];
            try { DRIP_ITEMS = JSON.parse('{{DRIP_JSON}}' || '[]'); } catch(e) { DRIP_ITEMS = []; }

            // ——— Apply theme CSS vars ———
            if (THEME.primary) document.documentElement.style.setProperty('--primary', THEME.primary);
            if (THEME.primary_dark) document.documentElement.style.setProperty('--primary-dark', THEME.primary_dark);
            if (THEME.accent) document.documentElement.style.setProperty('--accent', THEME.accent);
            if (THEME.bg) document.documentElement.style.setProperty('--bg', THEME.bg);
            if (THEME.surface) document.documentElement.style.setProperty('--surface', THEME.surface);
            if (THEME.gradient) document.documentElement.style.setProperty('--gradient', THEME.gradient);
            if (THEME.emoji) document.getElementById('nicheEmoji').textContent = THEME.emoji;
            if (THEME.tagline) document.getElementById('lpTagline').textContent = THEME.tagline;

            document.getElementById('logoAppName').textContent = APP_NAME;

            if (!QUESTIONS.length) {
                // fallback generic questions based on niche
                QUESTIONS = [
                    {question:"Qual seu maior desafio atual?",options:[
                        {text:"Começar algo novo",points:1},{text:"Manter consistência",points:2},{text:"Escalar resultados",points:3}],
                        result:{title:"Desafio identificado",desc:"Seu principal desafio está mapeado."}},
                    {question:"Há quanto tempo você busca uma solução?",options:[
                        {text:"Menos de 1 mês",points:1},{text:"1 a 6 meses",points:2},{text:"Mais de 6 meses",points:3}],
                        result:{title:"Tempo de jornada",desc:"Sua jornada indica experiência acumulada."}},
                    {question:"Qual resultado mais te interessa?",options:[
                        {text:"Melhorar habilidades",points:1},{text:"Aumentar renda",points:2},{text:"Transformação completa",points:3}],
                        result:{title:"Objetivo principal",desc:"Seu objetivo está alinhado com as melhores práticas."}},
                    {question:"Como você se avalia hoje (1-5)?",options:[
                        {text:"1-2 — Iniciante",points:1},{text:"3 — Intermediário",points:2},{text:"4-5 — Avançado",points:3}],
                        result:{title:"Autoavaliação",desc:"Seu nível atual indica o ponto de partida ideal."}},
                    {question:"Está pronto para começar?",options:[
                        {text:"Sim, agora!",points:3},{text:"Preciso de mais informações",points:1}],
                        result:{title:"Prontidão",desc:"Você está motivado para iniciar a transformação."}}
                ];
            }

            // ——— State ———
            var currentQ = 0;
            var answers = [];
            var deferredPrompt = null;

            // ——— DOM refs ———
            var $ = function(id) { return document.getElementById(id); };
            var views = ['view-landing','view-quiz','view-loading','view-drip','view-premium'];

            function showView(name) {
                views.forEach(function(v) {
                    var el = $(v); if (el) el.classList.remove('active');
                });
                var target = $(name); if (target) target.classList.add('active');
                window.scrollTo({top:0,behavior:'smooth'});
            }

            // ——— Haptics ———
            function haptic(ms) {
                ms = ms || 10;
                try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e) {}
            }

            // ——— Bottom Sheet ———
            function openSheet(html) {
                $('sheetContent').innerHTML = html;
                $('sheetOverlay').classList.add('open');
                haptic(12);
            }
            function closeSheet() {
                $('sheetOverlay').classList.remove('open');
            }
            $('sheetOverlay').addEventListener('click', function(e) {
                if (e.target === $('sheetOverlay')) closeSheet();
            });
            // swipe down to close
            var touchStartY = 0;
            $('sheetPanel').addEventListener('touchstart', function(e) { touchStartY = e.touches[0].clientY; });
            $('sheetPanel').addEventListener('touchmove', function(e) {
                var delta = e.touches[0].clientY - touchStartY;
                if (delta > 60 && $('sheetPanel').scrollTop <= 0) closeSheet();
            });

            // ——— Install prompt ———
            window.addEventListener('beforeinstallprompt', function(e) {
                e.preventDefault();
                deferredPrompt = e;
                $('btnInstall').classList.add('visible');
            });
            window.addEventListener('appinstalled', function() {
                deferredPrompt = null;
                $('btnInstall').classList.remove('visible');
            });
            $('btnInstall').addEventListener('click', function() {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then(function(r) {
                        if (r.outcome === 'accepted') $('btnInstall').classList.remove('visible');
                    });
                }
            });

            // ——— Quiz engine ———
            function startQuiz() {
                currentQ = 0;
                answers = [];
                showView('view-quiz');
                renderQuestion();
                haptic(10);
            }

            function renderQuestion() {
                if (currentQ >= QUESTIONS.length) {
                    finishQuiz();
                    return;
                }
                var q = QUESTIONS[currentQ];
                var pct = ((currentQ) / QUESTIONS.length) * 100;
                $('quizProgress').style.width = pct + '%';
                $('progressLabel').textContent = 'Pergunta ' + (currentQ + 1) + ' de ' + QUESTIONS.length;

                var optsHtml = (q.options || []).map(function(opt, idx) {
                    var text = typeof opt === 'string' ? opt : (opt.text || opt.label || 'Opção ' + (idx + 1));
                    return '<div class="option-item" data-idx="' + idx + '">' +
                        '<span>' + text + '</span>' +
                        '<span class="check-mark">✓</span></div>';
                }).join('');

                $('questionCard').innerHTML =
                    '<h2>' + (q.question || q.text || '') + '</h2>' +
                    '<div class="options-list">' + optsHtml + '</div>';

                var items = $('questionCard').querySelectorAll('.option-item');
                items.forEach(function(item) {
                    item.addEventListener('click', function() {
                        items.forEach(function(i) { i.classList.remove('selected'); });
                        item.classList.add('selected');
                        var idx = parseInt(item.getAttribute('data-idx'));
                        var opt = q.options[idx];
                        var pts = (typeof opt === 'object') ? (opt.points || opt.value || 1) : 1;
                        answers.push({questionIndex: currentQ, selectedIndex: idx, points: pts});
                        haptic(8);
                        setTimeout(function() {
                            currentQ++;
                            renderQuestion();
                        }, 250);
                    });
                });
            }

            function finishQuiz() {
                showView('view-loading');

                // simulate processing time
                var loadTime = 300 + Math.random() * 300;
                setTimeout(function() {
                    var totalScore = answers.reduce(function(acc, a) { return acc + a.points; }, 0);
                    var maxScore = QUESTIONS.reduce(function(acc, q) {
                        var maxPts = 0;
                        (q.options || []).forEach(function(o) {
                            var p = (typeof o === 'object') ? (o.points || 1) : 1;
                            if (p > maxPts) maxPts = p;
                        });
                        return acc + maxPts;
                    }, 0);
                    var ratio = maxScore > 0 ? totalScore / maxScore : 0.5;

                    var resultTitle, resultDesc;
                    if (ratio > 0.7) {
                        resultTitle = 'Você está no nível Avançado!';
                        resultDesc = 'Seus resultados mostram que você já tem uma base sólida. O próximo passo é a maestria.';
                    } else if (ratio > 0.4) {
                        resultTitle = 'Você está no nível Intermediário';
                        resultDesc = 'Bom progresso! Com ajustes estratégicos você alcançará resultados expressivos.';
                    } else {
                        resultTitle = 'Você está em fase de Descoberta';
                        resultDesc = 'Este é o momento ideal para construir uma base forte e acelerar seus resultados.';
                    }

                    // Build result items from questions
                    var resultItemsHtml = '';
                    QUESTIONS.forEach(function(q, i) {
                        var res = q.result || {};
                        var title = res.title || res.titulo || '';
                        var desc = res.desc || res.descricao || res.description || '';
                        if (title || desc) {
                            resultItemsHtml += '<div class="result-card"><h3>' + title + '</h3><p>' + desc + '</p></div>';
                        }
                    });

                    var sheetHtml =
                        '<div class="sheet-emoji">' + (THEME.emoji || '⚡') + '</div>' +
                        '<div class="sheet-title">' + resultTitle + '</div>' +
                        '<p class="sheet-desc">' + resultDesc + '</p>' +
                        resultItemsHtml +
                        (CHECKOUT_URL ?
                            '<div class="cta-section"><a href="' + CHECKOUT_URL + '" class="btn" onclick="haptic(15)">' + CTA_TEXT + '</a></div>' :
                            '<div class="cta-section"><button class="btn" onclick="document.getElementById(\'sheetOverlay\').classList.remove(\'open\');showView(\'view-premium\');haptic(10)">Ver Resultados Completos</button></div>');

                    showView('view-premium');
                    $('premiumDesc').textContent = resultDesc;
                    $('premiumResults').innerHTML = resultItemsHtml;

                    setTimeout(function() {
                        openSheet(sheetHtml);
                    }, 400);

                    // save progress
                    saveProgress();
                }, loadTime);
            }

            // ——— Share ———
            function shareResult() {
                var text = 'Veja meu resultado no ' + APP_NAME + '! ' + window.location.href;
                if (navigator.share) {
                    navigator.share({ title: APP_NAME, text: text, url: window.location.href })
                        .catch(function() { copyToClipboard(text); });
                } else {
                    copyToClipboard(text);
                }
                haptic(10);
            }

            function copyToClipboard(text) {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(function() {
                        alert('Link copiado! Compartilhe com seus amigos.');
                    });
                } else {
                    var ta = document.createElement('textarea');
                    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                    document.body.appendChild(ta); ta.select();
                    document.execCommand('copy'); document.body.removeChild(ta);
                    alert('Link copiado!');
                }
            }

            if ($('shareWhatsApp')) {
                $('shareWhatsApp').addEventListener('click', function() {
                    var text = encodeURIComponent('Veja meu resultado no ' + APP_NAME + '! ' + window.location.href);
                    window.open('https://wa.me/?text=' + text, '_blank');
                    haptic(10);
                });
            }
            if ($('shareCopy')) {
                $('shareCopy').addEventListener('click', function() { shareResult(); });
            }
            if ($('restartBtn')) {
                $('restartBtn').addEventListener('click', function() { startQuiz(); haptic(10); });
            }

            // ——— Drip timeline ———
            function renderDripTimeline() {
                if (!DRIP_ITEMS.length) return;

                var streak = getStreak();
                $('streakCount').textContent = streak;

                var firstAppOpen = getFirstOpen();
                var daysSinceStart = Math.floor((Date.now() - firstAppOpen) / 86400000);

                var html = '';
                DRIP_ITEMS.forEach(function(item) {
                    var day = item.day || item.unlock_day || 1;
                    var unlocked = day <= daysSinceStart;
                    var isToday = day === daysSinceStart;
                    var cls = unlocked ? (isToday ? 'today' : 'unlocked') : '';

                    html += '<div class="timeline-item' + (unlocked ? '' : ' timeline-locked') + '">' +
                        '<div class="timeline-dot ' + cls + '">' + (unlocked ? '✓' : day) + '</div>' +
                        '<div class="timeline-content">' +
                        '<h4>' + (item.title || 'Dia ' + day) + '</h4>' +
                        '<p>' + (item.type || item.content_type || 'Conteúdo liberado') + '</p>' +
                        '</div></div>';
                });
                $('timelineList').innerHTML = html || '<p style="color:var(--text-muted);text-align:center;">Nenhum conteúdo disponível ainda.</p>';
            }

            // ——— localStorage progress ———
            function getProgressKey() { return 'dzf_progress_' + APP_ID; }
            function getStreakKey() { return 'dzf_streak_' + APP_ID; }
            function getFirstOpenKey() { return 'dzf_first_' + APP_ID; }

            function getFirstOpen() {
                var stored = localStorage.getItem(getFirstOpenKey());
                if (!stored) {
                    stored = Date.now();
                    localStorage.setItem(getFirstOpenKey(), stored);
                }
                return parseInt(stored);
            }

            function getStreak() {
                var data = JSON.parse(localStorage.getItem(getStreakKey()) || '{"days":[],"lastDate":""}');
                var today = new Date().toISOString().slice(0, 10);
                if (data.lastDate === today) return data.days.length;
                var yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
                if (data.lastDate === yesterday) {
                    data.days.push(today);
                    data.lastDate = today;
                } else if (data.lastDate !== today) {
                    data.days = [today];
                    data.lastDate = today;
                }
                localStorage.setItem(getStreakKey(), JSON.stringify(data));
                return data.days.length;
            }

            function saveProgress() {
                var data = {
                    answers: answers,
                    score: answers.reduce(function(acc,a) { return acc + a.points; }, 0),
                    completedAt: new Date().toISOString(),
                    questionsCount: QUESTIONS.length
                };
                localStorage.setItem(getProgressKey(), JSON.stringify(data));
                getStreak();
            }

            function loadProgress() {
                var data = localStorage.getItem(getProgressKey());
                return data ? JSON.parse(data) : null;
            }

            // ——— Service Worker ———
            function registerSW() {
                if ('serviceWorker' in navigator && SW_URL) {
                    navigator.serviceWorker.register(SW_URL, { scope: '/app/' + SLUG + '/' })
                        .then(function(reg) { console.log('[PWA] SW registrado:', reg.scope); })
                        .catch(function(err) { console.warn('[PWA] SW falhou:', err); });
                }
            }

            // ——— Pull-to-refresh ———
            var pullStart = 0, pulling = false;
            document.addEventListener('touchstart', function(e) { pullStart = e.touches[0].clientY; pulling = true; });
            document.addEventListener('touchmove', function(e) {
                if (!pulling || window.scrollY > 5) return;
                var delta = e.touches[0].clientY - pullStart;
                if (delta > 80) {
                    pulling = false;
                    window.location.reload();
                }
            });
            document.addEventListener('touchend', function() { pulling = false; });

            // ——— Init ———
            function init() {
                registerSW();
                applyThemeVars();
                loadProgress();
                if (DRIP_ITEMS.length) renderDripTimeline();

                if ($('startBtn')) {
                    $('startBtn').addEventListener('click', function() {
                        startQuiz();
                    });
                }

                document.addEventListener('click', function(e) {
                    if (e.target.closest('.btn') || e.target.closest('.option-item')) {
                        haptic(8);
                    }
                });
            }

            function applyThemeVars() {
                if (THEME.primary) {
                    document.documentElement.style.setProperty('--primary', THEME.primary);
                    var glowHex = THEME.primary + '26';
                    document.documentElement.style.setProperty('--primary-glow', glowHex);
                }
                if (THEME.primary_dark) document.documentElement.style.setProperty('--primary-dark', THEME.primary_dark);
                if (THEME.accent) document.documentElement.style.setProperty('--accent', THEME.accent);
                if (THEME.bg) document.documentElement.style.setProperty('--bg', THEME.bg);
                if (THEME.surface) document.documentElement.style.setProperty('--surface', THEME.surface);
                if (THEME.gradient) document.documentElement.style.setProperty('--gradient', THEME.gradient);
                if (THEME.emoji) {
                    var emojiEl = document.getElementById('nicheEmoji');
                    if (emojiEl) emojiEl.textContent = THEME.emoji;
                }
                if (THEME.tagline) {
                    var taglineEl = document.getElementById('lpTagline');
                    if (taglineEl) taglineEl.textContent = THEME.tagline;
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // expose helpers
            window.__haptic = haptic;
            window.__openSheet = openSheet;
            window.__closeSheet = closeSheet;
        })();
    </script>
</body>
</html>
