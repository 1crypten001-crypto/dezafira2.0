[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# O healthcheck do Railway SEMPRE sonda a variável $PORT injetada — a doc
# oficial diz "This variable's value is also used when performing health
# checks" e healthcheckPort no toml é IGNORADO. Como $PORT apontava para o
# socat -> CDP do motor, e o motor (como o Chrome 136+) recusa conexão CDP
# com Host de hostname (anti-DNS-rebinding), o healthcheck ficava "service
# unavailable" para sempre.
#
# Por isso fixamos PORT=9000 (a porta do health_server.py, que responde 200
# para QUALQUER caminho). O CDP real (9222) fica só para a rede privada do
# backend via socat — o socat NÃO expõe a 9000.
healthcheckPath = "/healthz"
healthcheckPort = 9000
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[variables]
PORT = "9000"
